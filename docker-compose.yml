services:
  backend:
    build: ./backend
    container_name: ruc-backend
    ports:
      - "8000:8000"
    volumes:
      - db_data:/app/data
      - ./backend/app:/app/app
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/data/grades.db
      - POLL_INTERVAL=30
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
    container_name: ruc-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx-auth:/etc/nginx/auth:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
    external: true
    name: ruc-helper_db_data
