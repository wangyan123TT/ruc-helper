services:
  backend:
    build: ./backend
    container_name: ruc-backend
    # 只绑本机。nginx 走 docker 内网 proxy_pass 到 backend:8000，不需要对外映射；
    # 若绑 0.0.0.0，任何人都能直连 8000 绕过 nginx 的 auth_basic 拿到全部学生数据。
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - db_data:/app/data
      - ./backend/app:/app/app
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/data/grades.db
      - POLL_INTERVAL=30
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
    container_name: ruc-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx-auth:/etc/nginx/auth:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
    external: true
    name: ruc-helper_db_data
